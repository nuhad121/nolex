<style>
/* Layout: OMR-sheet inspired study desk. Sticky header with timing marks, four working tabs, question card + answer-sheet grid. */
:root{
  --bg:#e8eeeb; --card:#f7faf8; --ink:#10221d; --muted:#53665e; --line:#c6d3cd;
  --accent:#0a6a4d; --accent-ink:#ffffff; --accent-soft:#d3eadf;
  --bad:#b3261e; --bad-soft:#f7dcd9; --ok:#1c7b3e; --ok-soft:#d7efdd;
  --warn:#7c5200; --warn-soft:#f6e8c2; --mark:#10221d;
  --f-body:'Hind Siliguri','Noto Sans Bengali','Kalpurush','SolaimanLipi',system-ui,sans-serif;
  --f-head:'Noto Serif Bengali','Hind Siliguri','Kalpurush',serif;
  --dot-l:42%;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1714; --card:#15241f; --ink:#e3efe9; --muted:#94aaa0; --line:#2b3f38;
  --accent:#4cc79a; --accent-ink:#06241a; --accent-soft:#18392e;
  --bad:#ff9189; --bad-soft:#3d2120; --ok:#74d794; --ok-soft:#173526;
  --warn:#f0c25f; --warn-soft:#3a2f14; --mark:#e3efe9; --dot-l:62%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1714; --card:#15241f; --ink:#e3efe9; --muted:#94aaa0; --line:#2b3f38;
  --accent:#4cc79a; --accent-ink:#06241a; --accent-soft:#18392e;
  --bad:#ff9189; --bad-soft:#3d2120; --ok:#74d794; --ok-soft:#173526;
  --warn:#f0c25f; --warn-soft:#3a2f14; --mark:#e3efe9; --dot-l:62%; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);line-height:1.3;margin:0;text-wrap:balance}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.1rem;font-weight:600}
p{margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:16px 96px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top .in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-family:var(--f-head);font-weight:800;font-size:1.25rem;letter-spacing:.01em;white-space:nowrap}
.brand small{font-family:var(--f-body);font-weight:500;font-size:.78rem;color:var(--muted);margin-left:8px}
.marks{height:6px;background:repeating-linear-gradient(90deg,var(--mark) 0 7px,transparent 7px 15px);opacity:.8}
.tabs{display:flex;gap:4px}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.tab[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.tab:hover:not([aria-current="page"]){background:var(--accent-soft);color:var(--ink)}
.dock{display:none}
@media (max-width:760px){
  .top .tabs{display:none}
  .dock{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .dock .tab{padding:8px 2px;font-size:.78rem;text-align:center;line-height:1.25}
  .brand small{display:none}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);background:var(--accent-soft)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);font-size:.82rem;background:var(--bg);white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%;background:hsl(var(--h,160) 55% var(--dot-l))}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick label{cursor:pointer}
.pick input{position:absolute;opacity:0;pointer-events:none}
.pick span{display:inline-block;padding:7px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.pick input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pick input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.opt-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.opt-cards label{cursor:pointer;display:block}
.opt-cards input{position:absolute;opacity:0;pointer-events:none}
.opt-cards .box{display:block;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;height:100%;background:var(--bg)}
.opt-cards .box b{display:block}
.opt-cards input:checked+.box{border-color:var(--accent);background:var(--accent-soft)}
.opt-cards input:focus-visible+.box{outline:3px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-weight:600;font-size:.92rem}
select,input[type=text],input[type=date],input[type=number],textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
textarea{min-height:92px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--accent)}
.phase-strip{display:flex;gap:3px;height:34px}
.phase-strip div{border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:.74rem;color:var(--accent-ink);font-weight:600;overflow:hidden;min-width:0;padding:0 4px;white-space:nowrap}
.dayrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.daybtn{flex:0 0 auto;min-width:56px;padding:6px 8px;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer;text-align:center;line-height:1.25}
.daybtn small{display:block;color:var(--muted);font-size:.7rem}
.daybtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.daybtn[aria-pressed="true"] small{color:var(--accent-ink)}
.daybtn.done{border-color:var(--ok)}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);margin-top:3px}
.task .t.done{text-decoration:line-through;color:var(--muted)}
.mins{font-weight:700;white-space:nowrap}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:.9rem}
.expl{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:.93rem}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.qtext{font-size:1.08rem;font-weight:500;margin:12px 0}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:8px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .b{width:30px;height:30px;border-radius:50%;border:2px solid var(--mark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.95rem}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .b{background:var(--mark);color:var(--card)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .b{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.sheet button{height:36px;border:1.5px solid var(--line);background:var(--bg);border-radius:50%;cursor:pointer;font-size:.8rem;padding:0}
.sheet button.a{background:var(--mark);color:var(--card);border-color:var(--mark)}
.sheet button.cur{outline:3px solid var(--accent);outline-offset:1px}
.sheet button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.sheet button.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.quizgrid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:start}
@media (max-width:860px){.quizgrid{grid-template-columns:1fr}}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem}
.score{font-family:var(--f-head);font-size:2.6rem;font-weight:800;line-height:1.1}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:1.3rem}
.hbar{display:grid;grid-template-columns:110px 1fr 54px;gap:10px;align-items:center;margin-top:8px;font-size:.9rem}
.hbar .track{position:relative;height:12px;background:var(--line);border-radius:6px}
.hbar .track>div{height:100%;border-radius:6px;background:var(--accent)}
.hbar .track>i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.7}
.hbar.low .track>div{background:var(--bad)}
.entry{border-top:1px solid var(--line);padding:14px 0}
.entry:first-child{border-top:0}
ul.plain{margin:0;padding-left:20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tag-model{background:var(--warn-soft);color:var(--warn)}
@media (prefers-reduced-motion:no-preference){.bar>div,.hbar .track>div{transition:width .4s}}
</style>

var BNUM='০১২৩৪৫৬৭৮৯';
function bn(x){return String(x).replace(/\d/g,function(d){return BNUM[d]})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function rng(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function today0(){var d=new Date();d.setHours(0,0,0,0);return d}
function isoDate(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd}

              {sub:'MIX',t:'লেখা নিজে মূল্যায়ন: শুদ্ধ বানান, গুছিয়ে উপস্থাপন, সময় মেলানো',w:.20},{sub:'MIX',t:'দৈনিক পরীক্ষা দেওয়া',w:.12,exam:1}];
        day.subs=[w1.sub,w2.sub,A];
      }else{
        var idx=d-ph.start;
        if(idx%2===0){
          day.model=true;
          list=[{sub:'MIX',t:'পূর্ণাঙ্গ মডেল টেস্ট: প্রশ্নব্যাংকের একটি পূর্ণ সেট, নির্ধারিত সময়ে',w:.40,pyq:1},{sub:'MIX',t:'ফলাফল বিশ্লেষণ ও ভুলের খাতা হালনাগাদ',w:.25},
                {sub:'MIX',t:'ভাইভা প্র্যাকটিস: নিজের পরিচয়, জেলা, শিক্ষা ও পছন্দের বিষয়',w:.20,viva:1},{sub:'MIX',t:'দৈনিক পরীক্ষা দেওয়া',w:.15,exam:1}];
          day.theme='মডেল টেস্ট ও বিশ্লেষণ';
        }else{
          list=[{sub:A,t:'দুর্বল অংশ রিভিশন: '+topic(A),w:.25},{sub:Bs,t:'দুর্বল অংশ রিভিশন: '+topic(Bs),w:.25},
                {sub:'MIX',t:'ভাইভা প্র্যাকটিস: সাম্প্রতিক বিষয়, বাংলাদেশ ও বিশ্ব, নিজ বিষয় ('+((BG[p.bg]||BG.oth).n)+')',w:.25,viva:1},
                {sub:'BD',t:'সংবাদপত্র ও সাম্প্রতিক ঘটনা',w:.10},{sub:'MIX',t:'দৈনিক পরীক্ষা দেওয়া',w:.15,exam:1}];
        }
      }
      if(!day.theme)day.theme=day.subs.map(function(s){return SUBJ[s].n}).join(' · ');
    }
    if(B){
      var tw=(review||day.model)?.2:.25;
      var tt=bgT[tcnt%bgT.length];tcnt++;
      list.forEach(function(x){x.w=x.w*(1-tw)});
      list.splice(list.length>3?3:list.length,0,{sub:'TECH',t:'টেকনিক্যাল/প্রফেশনাল: '+tt,w:tw});
    }
    var mins=allocate(H,list.map(function(x){return x.w}));
    day.tasks=list.map(function(x,j){return {sub:x.sub,t:x.t,m:mins[j],exam:!!x.exam,pyq:!!x.pyq,viva:!!x.viva}});
    days.push(day);
  }
  return {phases:phases,days:days,key:JSON.stringify(p)};
}
function plan(){
  if(!S.profile)return null;
  var key=JSON.stringify(S.profile);
  if(!PLAN||PLAN.key!==key)PLAN=buildPlan(S.profile);
  return PLAN;
}
function curDayIdx(){
  var P=S.profile;if(!P)return 1;
  var diff=Math.floor((today0()-parseIso(P.start))/86400000)+1;
  return Math.min(Math.max(1,diff),P.timeline);
}
function dayDone(d){var pl=plan();if(!pl)return 0;var t=pl.days[d-1].tasks,n=0;t.forEach(function(_,i){if(S.done[d+':'+i])n++});return n}
function bestExam(d){var a=S.exams[d]||[];var b=null;a.forEach(function(x){if(!b||x.p>b.p)b=x});return b}

/* ---------- quiz engine ---------- */
var TIMER=null;
function stopTimer(){if(TIMER){clearInterval(TIMER);TIMER=null}}
function startQuiz(o){
  stopTimer();
  var ids=o.ids.filter(function(id){return BYID[id]&&scorable(BYID[id])});
  if(!ids.length)return;
  V.quiz={title:o.title,ids:ids,ans:{},i:0,mode:o.mode,kind:o.kind||'bank',day:o.day||null,seconds:o.minutes?Math.round(o.minutes*60):0,left:o.minutes?Math.round(o.minutes*60):0,done:false,res:null,filter:'all',confirm:false};
  if(V.quiz.mode==='exam'&&V.quiz.seconds){
    TIMER=setInterval(function(){
      var q=V.quiz;if(!q||q.done){stopTimer();return}
      q.left--;
      var el=document.getElementById('timer');if(el)el.textContent=clock(q.left);
      if(q.left<=0){finishQuiz()}
    },1000);
  }
  V.tab=o.kind==='daily'?'exam':V.tab;
  render();window.scrollTo(0,0);
}
function clock(s){s=Math.max(0,s);var m=Math.floor(s/60),x=s%60;return bn((m<10?'0':'')+m)+':'+bn((x<10?'0':'')+x)}
function isRight(q,ch){return ch!==undefined&&q.a.indexOf(ch)>=0}
function finishQuiz(){
  var Q=V.quiz;if(!Q||Q.done)return;
  stopTimer();
  var c=0,w=0,sk=0,per={},ts=Date.now();
  Q.ids.forEach(function(id){
    var q=BYID[id],ch=Q.ans[id],s=qsub(q.sub);
    per[s]=per[s]||{c:0,t:0};per[s].t++;
    if(ch===undefined){sk++;return}
    if(isRight(q,ch)){c++;per[s].c++}
    else{
      w++;
      var e=S.errs.filter(function(x){return x.id===id})[0];
      if(e){e.n=(e.n||1)+1;e.ch=ch;e.ts=ts;e.m=false}else S.errs.push({id:id,ch:ch,n:1,ts:ts,m:false,note:''});
    }
  });
  Object.keys(per).forEach(function(s){var a=S.subj[s]||{c:0,t:0};a.c+=per[s].c;a.t+=per[s].t;S.subj[s]=a});
  var total=Q.ids.length,rec={c:c,w:w,sk:sk,t:total,p:pct(c,total),sc:Math.round((c-w*0.5)*100)/100,ts:ts,title:Q.title,kind:Q.kind};
  if(Q.kind==='daily'){S.exams[Q.day]=(S.exams[Q.day]||[]);S.exams[Q.day].push(rec)}
  else S.hist.push(rec);
  if(S.hist.length>200)S.hist=S.hist.slice(-200);
  save();
  Q.done=true;Q.res=rec;Q.per=per;Q.filter='all';
  render();window.scrollTo(0,0);
}

function render(){
  document.getElementById('nav-top').innerHTML=navHtml();

function weeklyBox(day){

  var open=S.errs.filter(function(e){return !e.m}).length;
  var weak=weakSubjects(2);

/* --- exam --- */
function examIds(d){
  var pl=plan(),day=pl.days[d-1];
  var n=day.review||day.model?20:12;
  var tries=(S.exams[d]||[]).length;
  var r=rng(d*7919+tries*104729+17);
  var subs=day.subs.map(qsub).filter(function(s,i,a){return a.indexOf(s)===i&&s!=='TECH'&&s!=='MIX'});
  var pick=[],used={};
  var pools=subs.map(function(s){return shuffle(QB.filter(function(q){return qsub(q.sub)===s&&scorable(q)}).map(function(q){return q.id}),r)});
  var per=Math.floor(n/Math.max(1,subs.length));
  pools.forEach(function(p){p.slice(0,per).forEach(function(id){pick.push(id);used[id]=1})});
  var rest=shuffle(QB.filter(function(q){return scorable(q)&&(!subs.length||subs.indexOf(qsub(q.sub))>=0)&&!used[q.id]}).map(function(q){return q.id}),r);
  while(pick.length<n&&rest.length)pick.push(rest.shift());
  if(pick.length<n){var any=shuffle(QB.filter(function(q){return scorable(q)&&!used[q.id]&&pick.indexOf(q.id)<0}).map(function(q){return q.id}),r);while(pick.length<n&&any.length)pick.push(any.shift())}
  return shuffle(pick,r);
}

/* --- bank --- */
function bankPool(){
  var B=V.bank;
  return QB.filter(function(q){
    if(!scorable(q))return false;
    if(B.set!=='all'&&q.s!==B.set)return false;
    if(B.subs.length&&B.subs.indexOf(qsub(q.sub))<0)return false;
    return true;
  });
}

function explBlock(q,ch){
  var ok=ch===undefined?null:isRight(q,ch);
  var ans=q.a.map(function(i){return '('+LET[i]+') '+q.o[i]}).join(' অথবা ');
  var h='<div class="stack" style="margin-top:12px;gap:8px">';
  if(ok===false)h+='<div class="warn" style="background:var(--bad-soft);color:var(--bad)">আপনার উত্তর ('+LET[ch]+') '+esc(q.o[ch])+' ভুল। সঠিক উত্তর '+esc(ans)+'।</div>';
  else if(ok===true)h+='<div class="expl" style="background:var(--ok-soft);color:var(--ok)">সঠিক। উত্তর '+esc(ans)+'।</div>';
  else h+='<div class="expl">সঠিক উত্তর '+esc(ans)+'।</div>';
  if(q.e)h+='<div class="expl"><b>ব্যাখ্যা:</b> '+esc(q.e)+'</div>';
  else h+='<div class="expl small muted">এই প্রশ্নের বিস্তারিত ব্যাখ্যা প্রকাশিত সমাধানে নেই। ভুল হলে ভুলের খাতায় নোট যোগ করে রাখুন।</div>';
  if(q.w)h+='<div class="warn">'+esc(q.w)+'</div>';
  return h+'</div>';
}

  return h+'</section></div>';
}
function hbar(label,p,txt){return '<div class="hbar'+(p<80?' low':'')+'"><span>'+esc(label)+'</span><div class="track"><div style="width:'+p+'%"></div><i style="left:80%" title="লক্ষ্য ৮০%"></i></div><span>'+txt+'</span></div>'}

/* --- errors --- */
function viewErrors(){
  var F=V.errF,list=S.errs.filter(function(e){return BYID[e.id]});
  var open=list.filter(function(e){return !e.m});
  var subs={};list.forEach(function(e){subs[qsub(BYID[e.id].sub)]=1});
  var show=list.filter(function(e){
    if(F.show==='open'&&e.m)return false;
    if(F.show==='done'&&!e.m)return false;
    if(F.sub!=='all'&&qsub(BYID[e.id].sub)!==F.sub)return false;
    return true;
  }).sort(function(a,b){return b.ts-a.ts});
  var man=S.manual.filter(function(m){return F.sub==='all'||m.sub===F.sub});
  var h='<div class="stack"><section class="card stack"><div><h2>ভুলের খাতা</h2><p class="muted">প্রশ্নব্যাংকে ও দৈনিক পরীক্ষায় যে প্রশ্নে ভুল করেছেন, সব এখানে জমা হয়। নিজের ভুল তথ্যও যোগ করতে পারেন।</p></div>';
  var wk=weakSubjects(5);
  if(wk.length){var c={};open.forEach(function(e){var s=qsub(BYID[e.id].sub);c[s]=(c[s]||0)+1});var mx=c[wk[0]];h+='<div><b class="small">দুর্বল বিষয় (খোলা ভুল)</b>'+wk.map(function(s){return '<div class="hbar low"><span>'+esc(SUBJ[s].n)+'</span><div class="track"><div style="width:'+pct(c[s],mx)+'%"></div></div><span>'+bn(c[s])+'টি</span></div>'}).join('')+'</div>'}
  h+='<div class="row"><button class="btn" data-a="errprac"'+(open.length?'':' disabled')+'>ভুল প্রশ্নে অনুশীলন ('+bn(Math.min(open.length,20))+'টি)</button></div></section>';
  h+='<section class="card stack"><div class="grid2"><div class="field"><label for="ef1">বিষয়</label><select id="ef1" data-a="errsub"><option value="all">সব বিষয়</option>'+Object.keys(subs).map(function(s){return '<option value="'+s+'"'+(F.sub===s?' selected':'')+'>'+esc(SUBJ[s].n)+'</option>'}).join('')+'</select></div><div class="field"><span class="lbl">দেখান</span><div class="pick">'+[['open','খোলা'],['done','আয়ত্ত'],['all','সব']].map(function(f){return '<label><input type="radio" name="es" value="'+f[0]+'"'+(F.show===f[0]?' checked':'')+' data-a="errshow"><span>'+f[1]+'</span></label>'}).join('')+'</div></div></div>';
  if(!show.length)h+='<p class="muted">'+(list.length?'এই ছাঁকনিতে কিছু নেই।':'এখনো কোনো ভুল জমা হয়নি। প্রশ্নব্যাংকে অনুশীলন করলে ভুলগুলো এখানে আসবে।')+'</p>';
  show.forEach(function(e){
    var q=BYID[e.id];
    h+='<div class="entry"><div class="qhead"><span class="row" style="gap:8px">'+chip(q.sub)+'<span class="chip">'+bn(e.n||1)+' বার ভুল</span></span><label class="small row" style="gap:6px;cursor:pointer"><input type="checkbox" data-a="mastered" data-v="'+esc(e.id)+'"'+(e.m?' checked':'')+'> আয়ত্ত হয়েছে</label></div><div class="qtext" style="font-size:1rem">'+esc(q.q)+'</div><p class="small"><span style="color:var(--bad)">আপনার উত্তর: ('+LET[e.ch]+') '+esc(q.o[e.ch])+'</span><br><span style="color:var(--ok)">সঠিক উত্তর: '+q.a.map(function(i){return '('+LET[i]+') '+esc(q.o[i])}).join(' অথবা ')+'</span></p>'+(q.e?'<div class="expl small">'+esc(q.e)+'</div>':'')+(q.w?'<div class="warn small" style="margin-top:6px">'+esc(q.w)+'</div>':'')+'<div class="field" style="margin-top:8px"><label class="small" for="n-'+esc(e.id)+'">আমার নোট</label><input type="text" id="n-'+esc(e.id)+'" data-a="errnote" data-v="'+esc(e.id)+'" value="'+esc(e.note||'')+'" placeholder="কেন ভুল হলো, কীভাবে মনে রাখবেন"></div></div>';
  });
  h+='</section><section class="card stack"><h3>নিজের ভুল যোগ করুন</h3><div class="grid2"><div class="field"><label for="ms">বিষয়</label><select id="ms">'+Object.keys(SUBJ).filter(function(k){return k!=='MIX'}).map(function(k){return '<option value="'+k+'">'+esc(SUBJ[k].n)+'</option>'}).join('')+'</select></div><div class="field"><label for="mt">কোথায় ভুল করলেন</label><input type="text" id="mt" placeholder="যেমন: ণ-ত্ব বিধান বা tense এর নিয়ম"></div></div><div class="field"><label for="mc">সঠিক তথ্য বা নিয়ম</label><textarea id="mc" placeholder="যা মুখস্থ করতে হবে"></textarea></div><div><button class="btn" data-a="addman">খাতায় যোগ করুন</button></div>';
  if(man.length){h+='<div>';man.slice().reverse().forEach(function(m){h+='<div class="entry"><div class="qhead">'+chip(m.sub)+'<button class="btn ghost" data-a="delman" data-v="'+m.id+'">মুছুন</button></div><b>'+esc(m.t)+'</b><p>'+esc(m.c)+'</p></div>'});h+='</div>'}
  return h+'</section></div>';
}

/* --- progress --- */
function viewProg(){
  var h='<div class="stack">';
  var ex=[];Object.keys(S.exams).forEach(function(d){S.exams[d].forEach(function(x){ex.push({d:+d,p:x.p,ts:x.ts})})});
  ex.sort(function(a,b){return a.ts-b.ts});
  var all=ex.concat(S.hist.map(function(x){return {d:0,p:x.p,ts:x.ts}})).sort(function(a,b){return a.ts-b.ts});
  var tot=0,corr=0;Object.keys(S.subj).forEach(function(s){tot+=S.subj[s].t;corr+=S.subj[s].c});
  var streak=0;
  if(S.profile){var pl=plan(),c=curDayIdx();for(var d=c;d>=1;d--){if(dayDone(d)>0)streak++;else if(d!==c)break}}
  h+='<section class="card stack"><h2>আপনার অগ্রগতি</h2><div class="grid2"><div class="stat"><span class="muted small">মোট উত্তর দেওয়া প্রশ্ন</span><b>'+bn(tot)+'টি</b></div><div class="stat"><span class="muted small">সামগ্রিক নির্ভুলতা</span><b>'+(tot?bn(pct(corr,tot))+'%':'এখনো নেই')+'</b></div><div class="stat"><span class="muted small">পরীক্ষা ও অনুশীলনের সংখ্যা</span><b>'+bn(all.length)+'টি</b></div><div class="stat"><span class="muted small">টানা দিন (কাজ শেষ)</span><b>'+bn(streak)+' দিন</b></div></div></section>';
  h+='<section class="card stack"><h3>স্কোরের ধারা</h3>'+chart(all.slice(-20))+'</section>';
  h+='<section class="card stack"><h3>বিষয়ভিত্তিক নির্ভুলতা</h3>';
  var ks=Object.keys(S.subj).filter(function(s){return SUBJ[s]}).sort(function(a,b){return pct(S.subj[a].c,S.subj[a].t)-pct(S.subj[b].c,S.subj[b].t)});
  if(!ks.length)h+='<p class="muted">প্রশ্নব্যাংকে অনুশীলন করলে এখানে বিষয়ভিত্তিক হিসাব আসবে।</p>';
  ks.forEach(function(s){var p=S.subj[s];h+=hbar(SUBJ[s].n,pct(p.c,p.t),bn(pct(p.c,p.t))+'%')});
  h+='<p class="small muted">কালো দাগ ৮০% লক্ষ্য। লাল বার মানে লক্ষ্যের নিচে।</p></section>';
  h+='<section class="card stack"><h3>ব্যাকআপ ও পুনরুদ্ধার</h3><p class="small muted">আপনার তথ্য শুধু এই ব্রাউজারে থাকে। ব্রাউজারের ডেটা মুছলে হারিয়ে যাবে। নিচের লেখা কপি করে কোথাও রেখে দিন, দরকারে আবার পেস্ট করে ফেরত আনুন।</p><div class="row"><button class="btn ghost" data-a="backup">ব্যাকআপ দেখান ও কপি করুন</button></div>';
  if(V.backup)h+='<textarea id="bk" readonly>'+esc(JSON.stringify(S))+'</textarea>';
  h+='<div class="field"><label for="rs">পুনরুদ্ধার: ব্যাকআপের লেখা এখানে পেস্ট করুন</label><textarea id="rs" placeholder="{...}"></textarea></div>'+(V.restoreErr?'<p class="warn">'+esc(V.restoreErr)+'</p>':'')+'<div><button class="btn ghost" data-a="restore">পুনরুদ্ধার করুন</button></div></section></div>';
  return h;
}
function chart(a){
  if(!a.length)return '<p class="muted">কোনো পরীক্ষা বা অনুশীলন এখনো হয়নি।</p>';
  var W=640,H=190,L=34,Rr=10,T=10,Bm=26,n=a.length,bw=Math.min(28,(W-L-Rr)/n-6);
  var y=function(p){return T+(H-T-Bm)*(1-p/100)};
  var s='<div style="overflow-x:auto"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="স্কোরের বার চার্ট" style="width:100%;min-width:420px;height:auto">';
  [0,50,80,100].forEach(function(g){s+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y(g)+'" y2="'+y(g)+'" stroke="var(--line)" stroke-width="'+(g===80?1.6:1)+'"'+(g===80?' stroke-dasharray="5 4"':'')+'/><text x="'+(L-6)+'" y="'+(y(g)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+bn(g)+'</text>'});
  a.forEach(function(x,i){
    var cx=L+(W-L-Rr)*(i+.5)/n;
    s+='<rect x="'+(cx-bw/2)+'" y="'+y(x.p)+'" width="'+bw+'" height="'+(y(0)-y(x.p))+'" rx="3" fill="'+(x.p>=80?'var(--ok)':'var(--accent)')+'"/>';
    if(n<=14)s+='<text x="'+cx+'" y="'+(y(x.p)-4)+'" text-anchor="middle" font-size="10" fill="var(--ink)">'+bn(x.p)+'</text>';
    s+='<text x="'+cx+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+(x.d?'দি'+bn(x.d):'অ'+bn(i+1))+'</text>';
  });
  return s+'</svg></div><p class="small muted">"দি" মানে দৈনিক পরীক্ষার দিন নম্বর, "অ" মানে প্রশ্নব্যাংকের অনুশীলন। ডটেড রেখা ৮০% লক্ষ্য।</p>';
}

/* ---------- events ---------- */
function val(id){var e=document.getElementById(id);return e?e.value:''}
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-a]');if(!t)return;
  var a=t.getAttribute('data-a'),v=t.getAttribute('data-v');
  if(t.tagName==='INPUT'||t.tagName==='SELECT'||t.tagName==='TEXTAREA')return;
  act(a,v,t);
});
document.addEventListener('change',function(ev){
  var t=ev.target.closest('[data-a]');if(!t)return;
  var a=t.getAttribute('data-a'),v=t.getAttribute('data-v');
  if(t.tagName!=='INPUT'&&t.tagName!=='SELECT'&&t.tagName!=='TEXTAREA')return;
  act(a,v,t,true);
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='hrs'){var o=document.getElementById('hrsv');if(o)o.textContent=bn(t.value)+' ঘণ্টা'}
  if(t.id==='note'){S.notes[V.day]=t.value;save()}
});
function setupRead(){
  var c=document.querySelector('input[name=cadre]:checked'),tl=document.querySelector('input[name=timeline]:checked');
  V.setup={cadre:c?c.value:'A',timeline:tl?+tl.value:180,bg:val('bg')||'eng',hours:+val('hrs')||5,start:val('st')||isoDate(today0())};
}
function act(a,v,t,isChange){
  switch(a){
  case 'tab':stopTimer();if(V.quiz&&!V.quiz.done){V.quiz=null}V.tab=v;V.confirm=null;render();window.scrollTo(0,0);return;
  case 'su':setupRead();if(t.id==='hrs')return;return;
  case 'mkplan':setupRead();var o=V.setup;o.hours=Math.min(12,Math.max(2,o.hours));S.profile=o;V.setup=null;V.day=null;V.week=null;PLAN=null;S.done={};S.notes=S.notes||{};save();render();return;
  case 'cancelsetup':V.setup=null;render();return;
  case 'resetplan':V.confirm='resetplan';render();return;
  case 'cancel':V.confirm=null;render();return;
  case 'resetgo':V.confirm=null;V.setup=Object.assign({},S.profile);render();return;
  case 'week':V.week=+t.value;V.day=(V.week-1)*7+1;render();return;
  case 'day':V.day=+v;V.week=null;render();return;
  case 'gotoday':V.day=+v;V.week=null;render();return;
  case 'task':var k=V.day+':'+v;if(t.checked)S.done[k]=1;else delete S.done[k];save();render();return;
  case 'note':return;
  case 'takeexam':V.examDay=+v;V.tab='exam';render();window.scrollTo(0,0);return;
  case 'exday':V.examDay=+v;render();return;
  case 'startexam':var d=+v;V.examDay=d;var pl=plan();startQuiz({title:'দিন '+bn(d)+' এর পরীক্ষা',ids:examIds(d),mode:'exam',minutes:Math.ceil(examIds(d).length*0.6),kind:'daily',day:d});return;
  case 'bset':V.bank.set=t.value;V.bank.subs=[];render();return;
  case 'bsub':var i=V.bank.subs.indexOf(v);if(t.checked&&i<0)V.bank.subs.push(t.value);if(!t.checked&&i>=0)V.bank.subs.splice(i,1);render();return;
  case 'bmode':V.bank.mode=t.value;render();return;
  case 'bcount':V.bank.count=t.value;render();return;
  case 'border':V.bank.order=t.value;render();return;
  case 'startbank':
    var pool=bankPool(),B=V.bank,cnt=Math.min(B.count==='all'?pool.length:+B.count,pool.length),ids;
    if(B.order==='seq'){ids=pool.slice().sort(function(x,y){return x.s===y.s?x.n-y.n:(x.s<y.s?-1:1)}).slice(0,cnt).map(function(q){return q.id})}
    else ids=shuffle(pool.map(function(q){return q.id}),rng(Date.now())).slice(0,cnt);
    var mins=B.set!=='all'&&B.count==='all'?SETS[B.set].min:Math.ceil(cnt*0.6);
    startQuiz({title:B.set==='all'?'প্রশ্নব্যাংক':SETS[B.set].n,ids:ids,mode:B.mode,minutes:B.mode==='exam'?mins:0,kind:'bank'});return;
  case 'pick':var Q=V.quiz;var id=Q.ids[Q.i];if(Q.mode==='practice'&&Q.ans[id]!==undefined)return;Q.ans[id]=+v;render();return;
  case 'prev':V.quiz.i=Math.max(0,V.quiz.i-1);V.quiz.confirm=false;render();return;
  case 'next':V.quiz.i=Math.min(V.quiz.ids.length-1,V.quiz.i+1);V.quiz.confirm=false;render();return;
  case 'jump':V.quiz.i=+v;render();return;
  case 'askfinish':V.quiz.confirm=true;render();return;
  case 'cancelsubmit':V.quiz.confirm=false;render();return;
  case 'submit':finishQuiz();return;
  case 'quit':stopTimer();V.quiz=null;render();return;
  case 'done':stopTimer();V.quiz=null;render();window.scrollTo(0,0);return;
  case 'rfilter':V.quiz.filter=t.value;render();return;
  case 'errsub':V.errF.sub=t.value;render();return;
  case 'errshow':V.errF.show=t.value;render();return;
  case 'mastered':var e=S.errs.filter(function(x){return x.id===v})[0];if(e){e.m=t.checked;save();render()}return;
  case 'errnote':var e2=S.errs.filter(function(x){return x.id===v})[0];if(e2){e2.note=t.value;save()}return;
  case 'errprac':
    var open=S.errs.filter(function(e){return !e.m&&BYID[e.id]}).sort(function(a,b){return (b.n||1)-(a.n||1)||b.ts-a.ts}).slice(0,20).map(function(e){return e.id});
    startQuiz({title:'ভুল প্রশ্নে অনুশীলন',ids:open,mode:'practice',kind:'errors'});return;
  case 'addman':
    var tx=val('mt').trim(),cx=val('mc').trim();if(!tx)return;
    S.manual.push({id:Date.now(),sub:val('ms'),t:tx,c:cx});save();render();return;
  case 'delman':S.manual=S.manual.filter(function(m){return String(m.id)!==v});save();render();return;
  case 'backup':V.backup=true;render();var bk=document.getElementById('bk');if(bk){bk.select();try{navigator.clipboard.writeText(bk.value).catch(function(){})}catch(e){}}return;
  case 'restore':
    try{var o2=JSON.parse(val('rs'));if(!o2||typeof o2!=='object'||!('done' in o2))throw 0;var b=blank();for(var kk in b)if(o2[kk]===undefined)o2[kk]=b[kk];S=o2;save();PLAN=null;V.restoreErr='';V.day=null;render()}
    catch(e){V.restoreErr='ব্যাকআপের লেখাটি ঠিক নেই। পুরোটা কপি করে পেস্ট করেছেন কি না দেখুন।';render()}
    return;
  }
}
render();
})();
</script>
